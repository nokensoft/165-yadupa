<section class="py-24 bg-gray-50 overflow-hidden">
    <div class="max-w-7xl mx-auto px-6 mb-12">
        <div class="flex flex-col md:flex-row justify-between items-end gap-6">
            <div class="space-y-4">
                <h2 class="text-5xl font-black text-papua-brown uppercase italic tracking-tighter"><i class="fas fa-images mr-2"></i> Galeri Kegiatan</h2>
                <div class="w-24 h-3 bg-papua-red rounded-full"></div>
            </div>
            <p class="text-gray-500 text-lg max-w-md">Dokumentasi kegiatan YADUPA bersama masyarakat adat di berbagai wilayah Papua.</p>
        </div>
    </div>

    <!-- Auto-scroll Gallery -->
    <div x-data="{
            images: [
                { src: './public/img/blog/blog3.jpg', srcLarge: './public/img/blog/blog3.jpg', caption: 'Program Literasi di Lembah Baliem' },
                { src: './public/img/blog/blog6.png', srcLarge: './public/img/blog/blog6.png', caption: 'Pemetaan Hutan Adat Wilayah Arso' },
                { src: './public/img/blog/blog5.png', srcLarge: './public/img/blog/blog5.png', caption: 'Pelatihan Ekonomi Lokal' },
                { src: './public/img/blog/blog8.png', srcLarge: './public/img/blog/blog8.png', caption: 'Dokumentasi Tradisi Lisan' },
                { src: './public/img/blog/blog7.png', srcLarge: './public/img/blog/blog7.png', caption: 'Advokasi Hak Tanah Adat' },
                { src: './public/img/blog/blog5.png', srcLarge: './public/img/blog/blog5.png', caption: 'Workshop Kerajinan Noken' },
                { src: './public/img/blog/blog3.jpg', srcLarge: './public/img/blog/blog3.jpg', caption: 'Pendidikan Anak Dusun' },
                { src: './public/img/blog/blog4.jpg', srcLarge: './public/img/blog/blog4.jpg', caption: 'Pelestarian Lingkungan Hidup' }
            ],
            modalOpen: false,
            modalImg: '',
            modalCaption: '',
            scrollEl: null,
            speed: 0.2,
            openModal(img) {
                this.modalImg = img.srcLarge;
                this.modalCaption = img.caption;
                this.modalOpen = true;
                this.speed = 0;
            },
            closeModal() {
                this.modalOpen = false;
                this.speed = 0.2;
            },
            init() {
                this.scrollEl = this.$refs.track;
                this.animate();
            },
            animate() {
                if (this.scrollEl) {
                    this.scrollEl.scrollLeft += this.speed;
                    if (this.scrollEl.scrollLeft >= this.scrollEl.scrollWidth / 2) {
                        this.scrollEl.scrollLeft = 0;
                    }
                }
                requestAnimationFrame(() => this.animate());
            }
        }"
        @mouseenter="speed = 0"
        @mouseleave="if (!modalOpen) speed = 0.2">

        <div x-ref="track" class="flex gap-6 overflow-hidden" style="scrollbar-width: none;">
            <template x-for="(img, i) in [...images, ...images]" :key="i">
                <div class="shrink-0 w-72 md:w-80 group cursor-pointer" @click="openModal(img)">
                    
                    <!-- Image Container dengan ratio 4:5 -->
                    <div class="relative aspect-[4/5] rounded-3xl overflow-hidden shadow-lg border border-gray-100">
                        <img 
                            :src="img.src" 
                            :alt="img.caption" 
                            class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                        
                        <!-- Hover Overlay -->
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition flex items-center justify-center">
                            <i class="fas fa-search-plus text-white text-2xl opacity-0 group-hover:opacity-100 transition"></i>
                        </div>
                    </div>
                    
                    <!-- Caption -->
                    <p class="text-center text-sm font-bold text-gray-500 mt-4" x-text="img.caption"></p>
                </div>
            </template>
        </div>

        
        <!-- Zoom Modal -->
        <div x-show="modalOpen" x-cloak
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            @click="closeModal()"
            @keydown.escape.window="closeModal()"
            class="fixed inset-0 z-[999] bg-black/90 flex items-center justify-center p-6">

            <button @click="closeModal()" 
                    class="absolute top-6 right-6 w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white text-2xl transition">
                <i class="fas fa-times"></i>
            </button>

            <div @click.stop class="max-w-2xl w-full">
                
                <!-- Container dengan ratio 4:5 -->
                <div class="relative aspect-[4/5] w-full mx-auto rounded-3xl overflow-hidden shadow-2xl bg-black">
                    <img 
                        :src="modalImg" 
                        :alt="modalCaption" 
                        class="absolute inset-0 w-full h-full object-cover">
                </div>

                <!-- Caption -->
                <p class="text-center text-white font-bold text-lg mt-6" x-text="modalCaption"></p>
            </div>
        </div>


    </div>
</section>
