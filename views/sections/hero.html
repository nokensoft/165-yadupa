<section class="relative min-h-screen w-full overflow-hidden">
    <!-- Grid Background -->
    <div class="absolute inset-0 bg-grid"></div>

    <!-- Full Screen Image Slider -->
    <div class="relative w-full h-screen"
         x-data="{ 
            current: 0, 
            images: [
                './public/img/image1.jpg',
                './public/img/image2.jpg'
            ]
         }"
         x-init="setInterval(() => { current = (current + 1) % images.length }, 5000)">

        <!-- Images -->
        <template x-for="(img, index) in images" :key="index">
            <img 
                :src="img"
                :class="{
                    'absolute inset-0 w-full h-full object-cover transition-all duration-1000 ease-out': true,
                    'opacity-100': current === index,
                    'opacity-0': current !== index
                }"
                alt="Papua Landscape"
            >
        </template>

        <!-- Dark Overlay -->
        <!-- <div class="absolute inset-0 bg-black/30"></div> -->

        <!-- Simple Dots -->
        <div class="absolute bottom-12 left-1/2 -translate-x-1/2 flex gap-3 z-10">
            <template x-for="(img, index) in images" :key="index">
                <button 
                    @click="current = index"
                    :class="{
                        'w-3 h-3 rounded-full transition-all duration-300': true,
                        'bg-white scale-125': current === index,
                        'bg-white/50 hover:bg-white/80': current !== index
                    }"
                ></button>
            </template>
        </div>
    </div>
</section>
